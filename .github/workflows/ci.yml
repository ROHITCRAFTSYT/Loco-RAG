name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install (hash-pinned lock)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Lock satisfies pyproject
        # Fails if pyproject.toml gained or tightened a dependency the lock doesn't
        # satisfy. Regenerate with the command in requirements.txt's header.
        run: python -m pip check
      - name: Lint
        run: ruff check app tests scripts
      - name: Test
        run: pytest -q --cov --cov-report=term --cov-fail-under=85

  eval:
    # Retrieval-quality gate against the real embedder + vector store.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (hash-pinned lock)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Run retrieval eval
        env:
          DATA_DIR: ${{ runner.temp }}/eval-data
          CHROMA_DIR: ${{ runner.temp }}/eval-data/chroma
          DATABASE_URL: sqlite:///${{ runner.temp }}/eval-data/app.db
        run: |
          # Gates sit just below the measured baseline (README -> Benchmark):
          # one more missed document fails the job.
          python -m scripts.eval_retrieval --k 1,3,5 \
            --json eval-report.json --markdown eval-report.md \
            --min-recall 0.95 --min-context-recall 0.90
      - name: Publish summary
        if: always()
        run: |
          if [ -f eval-report.md ]; then
            { echo "## Retrieval eval"; echo; cat eval-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: loco-rag  # -> image tag loco-rag-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
      - name: Smoke-test backend image
        # Boots the image and checks /health, with networking disabled to prove
        # the baked-in models make the container start offline.
        run: |
          docker run -d --name smoke --network none loco-rag-backend
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || true)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker logs smoke | tail -20
          docker exec smoke python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"
          docker exec smoke python -c "from app.services.embeddings import get_embedder; print('embed dim', get_embedder().dim)"
          [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = "healthy" ]
